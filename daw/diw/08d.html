<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diseño responsive</title>
    <link rel="stylesheet" href="css/08d.css">
</head>
<body>

    <h1>Ejemplo con CSS</h1>
    <div class="img"></div>


    <h1>Ejemplo con Picture</h1>
    <picture>
        <source
            media="(max-width: 1199px)"
            srcset="img/moon.jpg"
        >
        <source
            media="(min-width: 1200px)"
            srcset="img/Content-is-like-water.svg"
        >
        <img src="img/moon.jpg" alt="Cabecera">
    </picture>


    
</body>
</html>
