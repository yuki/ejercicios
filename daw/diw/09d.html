<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diseño responsive</title>
    <link rel="stylesheet" href="css/09d.css">
</head>
<body>
    <div id="formulario">
        <form>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input
                    id="nombre"
                    type="text"
                >
            </div>

            <div class="form-group">
                <label for="email">Correo</label>
                <input
                    id="email"
                    type="email"
                >
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    rows="5"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <select id="curso">
                    <option>DAW</option>
                    <option>DAM</option>
                    <option>ASIR</option>
                </select>
            </div>

            <div class="form-group">
                <label for="curso">Uso</label>
                <label class="check">
                    <input type="checkbox">
                    Acepto la política de privacidad
                </label>
            </div>

               <button type="submit">
                    Enviar
                </button>

        </form>
    </div>
</body>
</html>
