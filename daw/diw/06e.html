<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="css/06e.css">
</head>
<body>
    <p>Primer párrafo</p>

    <p class="invisible">Segundo párrafo</p>

    <p>Tercer párrafo</p>

    <div class="caja roja"></div>
    <div class="caja azul invisible"></div>
    <div class="caja verde"></div>

    <h1>Ejemplo de tabla con collapse</h1>
    <table class="tabla-ejemplo">
        <tr>
            <th>Producto</th>
            <th>Stock</th>
            <th class="columna-colapsada">Precio</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>Portátil</td>
            <td>12</td>
            <td class="columna-colapsada">100€</td>
            <td>1200€</td>
        </tr>
        <tr class="fila-colapsada">
            <td>Monitor</td>
            <td>5</td>
            <td class="columna-colapsada">50€</td>
            <td>250€</td>
        </tr>
        <tr>
            <td>Ratón</td>
            <td>5</td>
            <td class="columna-colapsada">5€</td>
            <td>25€</td>
        </tr>
    </table>
    
</body>
</html>
