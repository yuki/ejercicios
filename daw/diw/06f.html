<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="css/06f.css">
    <script src="js/06f.js" defer></script>
</head>
<body>
    <h1>Visibility</h1>
    <p>Primer párrafo</p>

    <p id="textoInvisible" class="invisible">Segundo párrafo</p>

    <p>Tercer párrafo</p>

    <div class="caja roja"></div>
    <div id="cajaInvisible" class="caja azul invisible"></div>
    <div class="caja verde"></div>

    <h1>Opacity</h1>
    <p>Primer párrafo</p>

    <p id="textoOpaco" class="opacity">Segundo párrafo</p>

    <p>Tercer párrafo</p>

    <div class="caja roja"></div>
    <div id="cajaOpaca" class="caja azul opacity"></div>
    <div class="caja verde poco-opacity"></div>

    <div>
        <img src="img/moon.jpg" alt="" class="imagen"/>
    </div>
    
</body>
</html>
