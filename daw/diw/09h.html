<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Breadcrumb</title>
    <link rel="stylesheet" href="css/09h.css">
</head>
<body>
    <h1>Ejemplo de breadcrumb</h1>

    <nav class="breadcrumbs" aria-label="Migas de pan">
        <a href="/">Inicio</a>
        <a href="/cursos">Cursos</a>
        <a href="/cursos/web">Desarrollo Web</a>
        <span>JavaScript</span>
    </nav>

    <nav class="breadcrumbs2" aria-label="Migas de pan">
        <ol>
            <li>
                <a href="/">Inicio</a>
            </li>
            <li>
                <a href="/cursos">Cursos</a>
            </li>
            <li>
                <a href="/cursos/web">
                    Desarrollo Web
                </a>
            </li>
            <li>
                JavaScript
            </li>
        </ol>
    </nav>

</body>
</html>
