<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="css/07b.css">
</head>
<body>
    <h1>Ejemplos de flex</h1>

    <h2>Filas</h2>
    <h3>las cajas tienen flex-grow</h3>
    <div class="contenedor e1 b1">
        <div class="caja c1">A</div>
        <div class="caja c2">B</div>
        <div class="caja c3">C</div>
    </div>
    
    <h3>row-reverse: A tiene flex-shrink</h3>
    <div class="contenedor e2 b1">
        <div class="caja c4">A</div>
        <div class="caja c5">B</div>
        <div class="caja c6">C</div>
    </div>

    <h3>Reordenado con "order"</h3>
    <div class="contenedor e1 b1">
        <div class="caja c1 o1">A</div>
        <div class="caja c2 o2">B</div>
        <div class="caja c3 o3">C</div>
    </div>

    <h3>Alineado con "align-self"</h3>
    <div class="contenedor e1 b1 as">
        <div class="caja c1 als1">A</div>
        <div class="caja c2 als2">B</div>
        <div class="caja c3 als3">C</div>
    </div>

</body>
</html>
